<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Turf Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #111;
            color: white;
        }
        .admin-box {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>

<body class="p-4">
<div id="notifyBox"
     class="alert text-center d-none"
     style="position:absolute; top:20px; width:90%; max-width:420px; z-index:999;">
</div>
<div class="container">
    <h2 class="mb-4 text-warning">⚙ Admin Panel - Turf Management</h2>

    <!-- Add Turf Form -->
    <div class="admin-box mb-4">
        <h4>Add New Turf</h4>
        <form id="turfForm">

            <div class="mb-3">
                <label class="form-label">Turf Name</label>
                <input type="text" class="form-control" id="turfName" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Price per Hour</label>
                <input type="number"
                       class="form-control"
                       id="turfPrice"
                       required
                       min="1"
                       step="0.01"
                       oninput="if(this.value < 1) this.value='';">
            </div>


            <div class="mb-3">
                <label class="form-label">Sport Type</label>
                <select class="form-select" id="sportType" required>
                    <option value="Football">⚽ Football</option>
                    <option value="Cricket">🏏 Cricket</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                <select class="form-select" id="location" required>
                    <option value="" disabled selected>Select Location</option>
                    <option>Chennai</option>
                    <option>Bengaluru</option>
                    <option>Hyderabad</option>
                    <option>Pune</option>
                    <option>Mumbai</option>
                    <option>Delhi</option>
                    <option>Kolkata</option>
                    <option>Coimbatore</option>
                    <option>Madurai</option>
                    <option>Chandigarh</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100">Add Turf</button>
        </form>
    </div>

    <!-- Turf Listing -->
    <h4 class="text-info">📌 Existing Turfs</h4>

    <table class="table table-dark table-bordered mt-3">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Sport</th>
            <th>Location</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="turfTable"></tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const BASE_URL = "https://turfbooking-production.up.railway.app/turfs";
    function showMessage(type, msg) {
        const box = document.getElementById("notifyBox");
        box.className = `alert alert-${type} text-center`;
        box.innerHTML = msg;
        box.classList.remove("d-none");
    }
    document.addEventListener("DOMContentLoaded", fetchTurfs);
    document.getElementById("turfForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const turf = {
            name: document.getElementById("turfName").value,
            sportType: document.getElementById("sportType").value,
            location: document.getElementById("location").value,
            price:document.getElementById("turfPrice").value
        };

        fetch(`${BASE_URL}/add`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(turf)
        })
        .then(async res => {

            const text = await res.text();
            console.log("Server:", text);

            if(res.ok){
                showMessage("success","Turf Added Successfully!");
                fetchTurfs();
                document.getElementById("turfForm").reset();
            } else {
                showMessage("danger","Failed to add turf!");
            }
        });

    });


    function fetchTurfs() {
        fetch(`${BASE_URL}`)
            .then(res => res.json())
            .then(data => {
                const table = document.getElementById("turfTable");
                table.innerHTML = "";

                data.forEach(turf => {
                    table.innerHTML += `
                        <tr>
                            <td>${turf.id}</td>
                            <td>${turf.name}</td>
                            <td>${turf.sportType}</td>
                            <td>${turf.location}</td>
                            <td>${turf.price}</td>
                            <td>
                                <button class="btn btn-warning btn-sm" onclick="editTurf(${turf.id})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteTurf(${turf.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            });
    }

    // Delete Turf
    function deleteTurf(id) {
        if (!confirm("Are you sure you want to delete this turf?")) return;

        fetch(`${BASE_URL}/${id}`, { method: "DELETE" })
            .then(() => {
                showMessage("success","Turf Deleted!");
                fetchTurfs();
            });
    }

    function editTurf(id) {
        localStorage.setItem("editTurfId", id);
        window.location.href = "edit-turf.html";
    }
</script>

</body>
</html>
