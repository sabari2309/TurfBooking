<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Turf Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #111;
            color: white;
        }
        .admin-box {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        #notifyBox {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 250px;
            z-index: 9999;
            padding: 15px 25px;
            font-size: 18px;
        }
    </style>
</head>

<body class="p-4">

<!-- GLOBAL MESSAGE BOX -->
<div id="notifyBox" class="alert text-center d-none"></div>

<!-- DELETE CONFIRM BOX -->
<div id="deleteBox"
     class="alert alert-danger d-none text-center"
     style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
            width:90%; max-width:400px; z-index:999;">
    Are you sure you want to delete this turf? <br>
    <button class="btn btn-sm btn-light mt-2" onclick="confirmDelete()">Yes</button>
    <button class="btn btn-sm btn-secondary mt-2" onclick="cancelDelete()">No</button>
</div>

<!-- LOGOUT BUTTON -->
<div class="d-flex justify-content-end mb-3">
    <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
</div>

<div class="container">
    <h2 class="mb-4 text-warning">⚙ Admin Panel - Turf Management</h2>

    <!-- ADD TURF -->
    <div class="admin-box mb-4">
        <h4>Add New Turf</h4>
        <form id="turfForm">
            <div class="mb-3">
                <label class="form-label">Turf Name</label>
                <input type="text" class="form-control" id="turfName" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Price per Hour</label>
                <input type="number" class="form-control" id="turfPrice" min="1" step="0.01" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Sport Type</label>
                <select class="form-select" id="sportType" required>
                    <option value="Football">⚽ Football</option>
                    <option value="Cricket">🏏 Cricket</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                <select class="form-select" id="location" required>
                    <option value="" disabled selected>Select Location</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Bengaluru">Bengaluru</option>
                    <option value="Hyderabad">Hyderabad</option>
                    <option value="Pune">Pune</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Kolkata">Kolkata</option>
                    <option value="Coimbatore">Coimbatore</option>
                    <option value="Madurai">Madurai</option>
                    <option value="Chandigarh">Chandigarh</option>
                </select>
            </div>

            <button class="btn btn-success w-100">Add Turf</button>
        </form>
    </div>

    <!-- LIST TURFS -->
    <h4 class="text-info">📌 Existing Turfs</h4>

    <table class="table table-dark table-bordered mt-3">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Sport</th>
            <th>Location</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="turfTable"></tbody>
    </table>
</div>

<script>
    const BASE_URL = "https://turfbooking-production.up.railway.app/turfs";

    function showMessage(type, msg) {
        const box = document.getElementById("notifyBox");
        box.className = `alert alert-${type} text-center`;
        box.innerHTML = msg;
        box.classList.remove("d-none");
        setTimeout(() => box.classList.add("d-none"), 4000);
    }

    /* 🔐 ADMIN AUTH GUARD */
    const role = localStorage.getItem("role");
    if (role !== "ADMIN") {
        showMessage("danger", "Unauthorized access. Please login.");
        setTimeout(() => window.location.href = "login.html", 1500);
    }

    document.addEventListener("DOMContentLoaded", fetchTurfs);

    document.getElementById("turfForm").addEventListener("submit", e => {
        e.preventDefault();

        const turf = {
            name: turfName.value,
            sportType: sportType.value,
            location: location.value,
            price: turfPrice.value
        };

        fetch(`${BASE_URL}/add`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(turf)
        })
        .then(res => res.ok ? fetchTurfs() : Promise.reject())
        .then(() => {
            showMessage("success", "Turf Added Successfully!");
            turfForm.reset();
        })
        .catch(() => showMessage("danger", "Failed to add turf"));
    });

    function fetchTurfs() {
        fetch(BASE_URL)
            .then(res => res.json())
            .then(data => {
                turfTable.innerHTML = "";
                data.forEach(turf => {
                    turfTable.innerHTML += `
                        <tr>
                            <td>${turf.id}</td>
                            <td>${turf.name}</td>
                            <td>${turf.sportType}</td>
                            <td>${turf.location}</td>
                            <td>${turf.price}</td>
                            <td>
                                <button class="btn btn-warning btn-sm" onclick="editTurf(${turf.id})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteTurf(${turf.id})">Delete</button>
                            </td>
                        </tr>`;
                });
            });
    }

    let deleteId = null;

    function deleteTurf(id) {
        deleteId = id;
        deleteBox.classList.remove("d-none");
    }

    function confirmDelete() {
        fetch(`${BASE_URL}/${deleteId}`, { method: "DELETE" })
            .then(() => {
                showMessage("success", "Turf Deleted!");
                fetchTurfs();
            });
        deleteBox.classList.add("d-none");
    }

    function cancelDelete() {
        deleteId = null;
        deleteBox.classList.add("d-none");
    }

    function editTurf(id) {
        localStorage.setItem("editTurfId", id);
        window.location.href = "edit-turf.html";
    }
    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }
</script>

</body>
</html>
