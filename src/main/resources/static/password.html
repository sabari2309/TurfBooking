<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: url("https://images.pexels.com/photos/114296/pexels-photo-114296.jpeg") no-repeat center center fixed;
            background-size: cover;
            position: relative;
            margin: 0;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
        }

        .reset-card {
            position: relative;
            z-index: 2;
            background: rgba(255,255,255,0.92);
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.35);
            animation: fadeIn 0.8s ease-in-out;
        }

        h2 { font-weight: 600; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100 p-4">

<!-- GLOBAL NOTIFICATION BOX -->
<div id="notifyBox"
     class="alert text-center d-none"
     style="position:absolute; top:20px; width:90%; max-width:420px; z-index:999;">
</div>

<!-- Step 1: Enter Email -->
<div class="reset-card" id="emailScreen">
    <h2 class="text-center mb-3">Reset Password</h2>

    <input id="email" type="email" class="form-control mb-3" placeholder="Enter Email" required>

    <button class="btn btn-primary w-100" onclick="verifyEmail()">Send OTP</button>

    <p class="text-center mt-3 text-dark">
        Go back to <a href="login.html"><b>Login</b></a>
    </p>
</div>


<!-- Step 2: OTP Verification -->
<div class="reset-card" id="otpScreen" style="display:none;">
    <h2 class="text-center mb-3">Verify OTP</h2>

    <p class="text-center">OTP sent to <b id="otpEmail"></b></p>

    <input id="otpInput" type="text" class="form-control mb-3" placeholder="Enter OTP">

    <button class="btn btn-success w-100 mb-2" onclick="verifyOtp()">Verify OTP</button>
    <button class="btn btn-secondary w-100" onclick="resendOtp()">Resend OTP</button>
</div>


<!-- Step 3: New Password -->
<div class="reset-card" id="passwordScreen" style="display:none;">
    <h2 class="text-center mb-3">Set New Password</h2>

    <div class="input-group mb-2">
        <input id="newPass" type="password" class="form-control" placeholder="New Password" required>
        <span class="input-group-text" onclick="togglePassword('newPass', this)" style="cursor:pointer;">
            👁️
        </span>
    </div>

    <div class="input-group mb-3">
        <input id="confirmPass" type="password" class="form-control" placeholder="Confirm Password" required>
        <span class="input-group-text" onclick="togglePassword('confirmPass', this)" style="cursor:pointer;">
            👁️
        </span>
    </div>

    <button class="btn btn-success w-100 mb-2" onclick="resetPassword()">Reset Password</button>
</div>



<script>
    const AUTH_URL = "https://turfbooking-production.up.railway.app/auth";
    let emailValue = "";

    function showMessage(type, msg) {
        const box = document.getElementById("notifyBox");
        box.className = `alert alert-${type} text-center`;
        box.innerHTML = msg;
        box.classList.remove("d-none");
        setTimeout(() => box.classList.add("d-none"), 3000);
    }

    function togglePassword(inputId, iconElement) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            iconElement.textContent = "🙈";
        } else {
            input.type = "password";
            iconElement.textContent = "👁️";
        }
    }

    function verifyEmail() {
        emailValue = document.getElementById("email").value.trim();

        if (!emailValue) {
            showMessage("danger", "Please enter email address");
            return;
        }

        fetch(AUTH_URL + "/mail-exists?email=" + emailValue)
            .then(async res => {
                const msg = await res.text();

                if (!res.ok) {
                    showMessage("danger",
                        `User doesn't exist!<br><a href='signup.html' style='color:#0044ff;'><b>Go to Signup Page</b></a>`);
                    return;
                }

                sendOtp();
            })
            .catch(() => showMessage("danger", "Error checking email"));
    }

    function sendOtp() {
        fetch(AUTH_URL + "/send-email-otp?email=" + emailValue)
            .then(async res => {
                const msg = await res.text();

                if (!res.ok) {
                    showMessage("danger", msg);
                    return;
                }

                document.getElementById("otpEmail").innerText = emailValue;
                document.getElementById("emailScreen").style.display = "none";
                document.getElementById("otpScreen").style.display = "block";

                showMessage("success", "OTP sent to " + emailValue);
            });
    }

    function resendOtp() {
        sendOtp();
    }

    function verifyOtp() {
        const otp = document.getElementById("otpInput").value.trim();

        fetch(AUTH_URL + "/verify-email-otp?email=" + emailValue + "&otp=" + otp)
            .then(async res => {
                const msg = await res.text();

                if (!res.ok) {
                    showMessage("danger", "Invalid OTP! Try again.");
                    return;
                }

                document.getElementById("otpScreen").style.display = "none";
                document.getElementById("passwordScreen").style.display = "block";

                showMessage("success", "OTP Verified! Set your new password.");
            });
    }

    function resetPassword() {
        const newPass = document.getElementById("newPass").value.trim();
        const confirmPass = document.getElementById("confirmPass").value.trim();

        if (newPass.length < 6) {
            showMessage("danger", "Password must be at least 6 characters long!");
            return;
        }

        if (newPass !== confirmPass) {
            showMessage("danger", "Passwords do not match!");
            return;
        }

        const payload = { email: emailValue, password: newPass };

        fetch(AUTH_URL + "/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(async res => {
            const msg = await res.text();

            if (!res.ok) {
                showMessage("danger", msg);
                return;
            }

            showMessage("success", "Password reset successfully! Redirecting...");
            setTimeout(() => window.location.href = "login.html", 1500);
        });
    }
</script>

</body>
</html>
