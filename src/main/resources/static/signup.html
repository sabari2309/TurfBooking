<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: url("https://images.pexels.com/photos/114296/pexels-photo-114296.jpeg") no-repeat center center fixed;
            background-size: cover;
            position: relative;
            margin: 0;
        }

        /* Dark overlay to give clarity */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
        }

        .signup-card {
            position: relative;
            z-index: 2;
            background: rgba(255,255,255,0.92);
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease-in-out;
        }

        h2 {
            font-weight: 600;
        }

        /* Smooth fade animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100 p-4">

<div class="signup-card">
    <h2 class="text-center mb-3">Signup</h2>

    <input id="name" type="text" class="form-control mb-2" placeholder="Name">
    <input id="email" type="email" class="form-control mb-2" placeholder="Email">
    <input id="password" type="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-success w-100" onclick="signup()">Create Account</button>

    <p class="mt-3 text-center text-dark">
        Already have an account?
        <a href="login.html"><b>Login</b></a>
    </p>
</div>

<script>
    const AUTH_URL = "http://localhost:8082/auth";

    function signup() {
        const user = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        };

        fetch(AUTH_URL + "/signup", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(user)
        })
        .then(async res => {
            if (res.ok) {
                alert("Signup successful! Please login.");
                window.location.href = "login.html";
            } else {
                const msg = await res.text();
                alert("Signup failed: " + msg);
            }
        });
    }
</script>

</body>
</html>
